name: Jeffrey protected release

on:
  repository_dispatch:
    types: [jeffrey_release_task]

concurrency:
  group: jeffrey-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    env:
      JEFFREY_TASK_ID: ${{ github.event.client_payload.task_id }}
      JEFFREY_BACKEND_URL: ${{ secrets.JEFFREY_BACKEND_URL }}
      DEVELOPMENT_CALLBACK_SECRET: ${{ secrets.DEVELOPMENT_CALLBACK_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNER_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the exact approved commit
        id: resolve
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DEVELOPMENT_CALLBACK_SECRET" \
            "$JEFFREY_BACKEND_URL/api/development/tasks/$JEFFREY_TASK_ID/runner" \
            -o .jeffrey-development-task.json
          APPROVED_SHA=$(node -e "const x=require('./.jeffrey-development-task.json');process.stdout.write(x.task.previewSha||'')")
          test -n "$APPROVED_SHA"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH" "jeffrey/task-$JEFFREY_TASK_ID"
          PREVIOUS_SHA=$(git rev-parse "origin/$DEFAULT_BRANCH")
          test "$(git rev-parse "origin/jeffrey/task-$JEFFREY_TASK_ID")" = "$APPROVED_SHA"
          git checkout --detach "$APPROVED_SHA"
          rm -f .jeffrey-development-task.json
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Re-run all release checks
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run build

      - name: Deploy the approved commit
        run: npx wrangler deploy --config dist/server/wrangler.json --name "${{ secrets.PRODUCTION_WORKER_NAME }}"

      - name: Verify production health
        run: |
          curl --fail --silent --show-error "${{ secrets.PRODUCTION_URL }}/" -o /dev/null
          curl --fail --silent --show-error "${{ secrets.PRODUCTION_URL }}/manifest.webmanifest" -o /dev/null

      - name: Advance the production branch
        run: git push origin "HEAD:${{ steps.resolve.outputs.default_branch }}"

      - name: Confirm publication
        env:
          PUBLISHED_SHA: ${{ steps.resolve.outputs.approved_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.resolve.outputs.previous_sha }}
        run: node scripts/development/sign-callback.mjs published "你确认的版本已经发布"

      - name: Start automatic rollback
        if: failure()
        env:
          PREVIOUS_PRODUCTION_SHA: ${{ steps.resolve.outputs.previous_sha }}
        run: node scripts/development/sign-callback.mjs rollback_running "发布检查未通过，正在自动恢复旧版本"

      - name: Restore the previous production commit
        if: failure() && steps.resolve.outputs.previous_sha != ''
        run: |
          git checkout --detach "${{ steps.resolve.outputs.previous_sha }}"
          npm ci
          npm run build
          npx wrangler deploy --config dist/server/wrangler.json --name "${{ secrets.PRODUCTION_WORKER_NAME }}"

      - name: Confirm rollback
        if: failure() && steps.resolve.outputs.previous_sha != ''
        env:
          PREVIOUS_PRODUCTION_SHA: ${{ steps.resolve.outputs.previous_sha }}
        run: node scripts/development/sign-callback.mjs rolled_back "旧版本已恢复，正式 App 可以继续使用"
